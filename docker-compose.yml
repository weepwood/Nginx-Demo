services:
  protected-nginx:
    image: nginx:1.27-alpine
    container_name: nginx-demo-protected-resources
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./demo-images:/srv/images:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-demo-backend
    ports:
      - "8002:8002"
    environment:
      SERVER_PORT: "8002"
      IMAGE_BASE_URL: "http://protected-nginx:8081/images/"
      IMAGE_USERNAME: "${IMAGE_USERNAME:-mrr-image}"
      IMAGE_PASSWORD: "${IMAGE_PASSWORD:-change-me}"
      APP_AUTH_USERNAME: "${APP_AUTH_USERNAME:-demo}"
      APP_AUTH_PASSWORD: "${APP_AUTH_PASSWORD:-demo-pass}"
      APP_AUTH_TOKEN: "${APP_AUTH_TOKEN:-demo-token-change-me}"
    depends_on:
      protected-nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
